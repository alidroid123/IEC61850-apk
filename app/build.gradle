plugins {
    id 'com.android.application'
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))
def vMajor = versionProps['versionMajor'].toInteger()
def vMinor = versionProps['versionMinor'].toInteger()
def vPatch = versionProps['versionPatch'].toInteger()

def keystorePropsFile = rootProject.file('keystore.properties')
def hasSigningConfig = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasSigningConfig) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.alidev.dfrtools'
    compileSdk 34

    defaultConfig {
        applicationId "com.alidev.dfrtools"
        minSdk 24
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"

        // Fase 3: IEC 61850 DFR Downloader native build (libiec61850, GPLv3 - see
        // app/src/main/cpp/libiec61850/COPYING). Only 64/32-bit ARM targeted since
        // that covers virtually all Android phones/tablets used in the field;
        // add x86_64 here too if testing on an emulator.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
