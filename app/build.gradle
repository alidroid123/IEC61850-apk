plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))
def vMajor = versionProps['versionMajor'].toInteger()
def vMinor = versionProps['versionMinor'].toInteger()
def vPatch = versionProps['versionPatch'].toInteger()

def keystorePropsFile = rootProject.file('keystore.properties')
def hasSigningConfig = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasSigningConfig) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.alidev.dfrtools'
    compileSdk 34

    defaultConfig {
        applicationId "com.alidev.dfrtools"
        minSdk 24
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"

        // Fase 3: IEC 61850 DFR Downloader native build (libiec61850, GPLv3 - see
        // app/src/main/cpp/libiec61850/COPYING). Only 64/32-bit ARM targeted since
        // that covers virtually all Android phones/tablets used in the field;
        // add x86_64 here too if testing on an emulator.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}

// Every time a release APK is built - from Android Studio's Build menu (with the "release"
// build variant selected) or from the command line - automatically commit + tag + push this
// release to git and publish it as a GitHub Release with the APK attached, then bump
// version.properties so the *next* release build gets the next version number. Skipped when
// the working tree is already clean (nothing changed since the last publish), so re-running an
// up-to-date build twice in a row doesn't create a duplicate empty release.
tasks.register('publishReleaseToGit') {
    group = 'release'
    description = 'Commits/tags/pushes the just-built release APK to git and GitHub Releases, then bumps version.properties for the next build.'
    doLast {
        def statusOut = new ByteArrayOutputStream()
        exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'status', '--porcelain'
            standardOutput = statusOut
        }
        if (statusOut.toString().trim().isEmpty()) {
            logger.lifecycle("==> publishReleaseToGit: working tree clean, nothing new since the last release - skipping.")
            return
        }

        def apk = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (!apk.exists()) {
            throw new GradleException("Release APK not found at ${apk} - did assembleRelease succeed?")
        }

        def releasedVersionName = "${vMajor}.${vMinor}.${vPatch}"
        def tag = "v${releasedVersionName}"

        // Stage a copy outside the repo so the binary is never at risk of being committed.
        def tmpDir = System.getenv('TEMP') ?: System.getProperty('java.io.tmpdir')
        def stagedApk = new File(tmpDir, "ComtradeDownloader-${releasedVersionName}.apk")
        stagedApk.bytes = apk.bytes

        // Bump for the *next* build before committing, so this one commit captures both
        // "this is release vX.Y.Z" and "next build will be vX.Y.(Z+1)".
        def nextPatch = vPatch + 1
        versionPropsFile.text = "versionMajor=${vMajor}\nversionMinor=${vMinor}\nversionPatch=${nextPatch}\n"

        exec { workingDir rootProject.projectDir; commandLine 'git', 'add', '-A' }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'commit', '-m', "Release ${tag}" }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'tag', tag; ignoreExitValue = true }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'push', 'origin', 'master' }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'push', 'origin', tag; ignoreExitValue = true }

        def ghExe = new File('C:/Program Files/GitHub CLI/gh.exe').exists() ? 'C:/Program Files/GitHub CLI/gh.exe' : 'gh'
        exec {
            workingDir rootProject.projectDir
            commandLine ghExe, 'release', 'create', tag, stagedApk.absolutePath, '--title', tag, '--notes', 'Automated release'
            ignoreExitValue = true
        }

        stagedApk.delete()
        logger.lifecycle("==> Release ${tag} published: https://github.com/alidroid123/IEC61850-apk/releases/tag/${tag}")
        logger.lifecycle("==> version.properties bumped - next release build will be v${vMajor}.${vMinor}.${nextPatch}")
    }
}

// AGP registers its variant tasks (assembleRelease included) lazily during project evaluation,
// so wiring this from afterEvaluate ensures the task actually exists by the time we look it up.
afterEvaluate {
    tasks.named('assembleRelease') {
        finalizedBy 'publishReleaseToGit'
    }
}
