plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))
def vMajor = versionProps['versionMajor'].toInteger()
def vMinor = versionProps['versionMinor'].toInteger()
def vPatch = versionProps['versionPatch'].toInteger()

def keystorePropsFile = rootProject.file('keystore.properties')
def hasSigningConfig = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasSigningConfig) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.alidev.dfrtools'
    compileSdk 34

    defaultConfig {
        applicationId "com.alidev.dfrtools"
        minSdk 24
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"

        // Fase 3: IEC 61850 DFR Downloader native build (libiec61850, GPLv3 - see
        // app/src/main/cpp/libiec61850/COPYING). Only 64/32-bit ARM targeted since
        // that covers virtually all Android phones/tablets used in the field;
        // add x86_64 here too if testing on an emulator.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}

// Every time a release APK is built - from Android Studio's Build menu (with the "release"
// build variant selected) or from the command line - automatically commit + tag + push this
// release to git and publish it as a GitHub Release with the APK attached, then bump
// version.properties so the *next* release build gets the next version number. Skipped when
// the working tree is already clean (nothing changed since the last publish), so re-running an
// up-to-date build twice in a row doesn't create a duplicate empty release.
tasks.register('publishReleaseToGit') {
    group = 'release'
    description = 'Commits/tags/pushes the just-built release APK to git and GitHub Releases, then bumps version.properties for the next build.'
    doLast {
        def statusOut = new ByteArrayOutputStream()
        exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'status', '--porcelain'
            standardOutput = statusOut
        }
        if (statusOut.toString().trim().isEmpty()) {
            logger.lifecycle("==> publishReleaseToGit: working tree clean, nothing new since the last release - skipping.")
            return
        }

        def apk = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (!apk.exists()) {
            throw new GradleException("Release APK not found at ${apk} - did assembleRelease succeed?")
        }

        def releasedVersionName = "${vMajor}.${vMinor}.${vPatch}"
        def tag = "v${releasedVersionName}"

        // Stage a copy outside the repo so the binary is never at risk of being committed.
        def tmpDir = System.getenv('TEMP') ?: System.getProperty('java.io.tmpdir')
        def stagedApk = new File(tmpDir, "ComtradeDownloader-${releasedVersionName}.apk")
        stagedApk.bytes = apk.bytes

        // Bump for the *next* build before committing, so this one commit captures both
        // "this is release vX.Y.Z" and "next build will be vX.Y.(Z+1)".
        def nextPatch = vPatch + 1
        versionPropsFile.text = "versionMajor=${vMajor}\nversionMinor=${vMinor}\nversionPatch=${nextPatch}\n"

        exec { workingDir rootProject.projectDir; commandLine 'git', 'add', '-A' }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'commit', '-m', "Release ${tag}" }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'tag', tag; ignoreExitValue = true }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'push', 'origin', 'master' }
        exec { workingDir rootProject.projectDir; commandLine 'git', 'push', 'origin', tag; ignoreExitValue = true }

        def ghExe = new File('C:/Program Files/GitHub CLI/gh.exe').exists() ? 'C:/Program Files/GitHub CLI/gh.exe' : 'gh'
        exec {
            workingDir rootProject.projectDir
            commandLine ghExe, 'release', 'create', tag, stagedApk.absolutePath, '--title', tag, '--notes', 'Automated release'
            ignoreExitValue = true
        }

        stagedApk.delete()
        logger.lifecycle("==> Release ${tag} published: https://github.com/alidroid123/IEC61850-apk/releases/tag/${tag}")
        logger.lifecycle("==> version.properties bumped - next release build will be v${vMajor}.${vMinor}.${nextPatch}")

        sendFcmTopicPush(
                "Update Tersedia",
                "Versi ${tag} sudah tersedia. Buka aplikasi untuk update."
        )
    }
}

/**
 * Signs a JWT (RS256) assertion for a Google service account, exchanges it for an OAuth2 access
 * token, then sends a data-only FCM push to the "app_updates" topic - implemented with plain
 * JDK crypto/HTTP (no extra Gradle dependency) since Google's legacy FCM server-key HTTP API was
 * shut down in June 2024; the HTTP v1 API requires this OAuth2 bearer-token exchange instead.
 * No-ops (with a log line) if firebase-service-account.json isn't present - see
 * project_fcm_push_notifications memory for how to obtain that key.
 */
def sendFcmTopicPush(String title, String body) {
    def keyFile = rootProject.file('firebase-service-account.json')
    if (!keyFile.exists()) {
        logger.lifecycle("==> firebase-service-account.json not found - skipping push notification send.")
        return
    }
    try {
        def sa = new groovy.json.JsonSlurper().parse(keyFile)

        long nowSec = System.currentTimeMillis() / 1000L
        String headerJson = groovy.json.JsonOutput.toJson([alg: "RS256", typ: "JWT"])
        String claimsJson = groovy.json.JsonOutput.toJson([
                iss  : sa.client_email,
                scope: "https://www.googleapis.com/auth/firebase.messaging",
                aud  : sa.token_uri,
                iat  : nowSec,
                exp  : nowSec + 3600L
        ])

        String headerB64 = Base64.getUrlEncoder().withoutPadding().encodeToString(headerJson.getBytes("UTF-8"))
        String claimsB64 = Base64.getUrlEncoder().withoutPadding().encodeToString(claimsJson.getBytes("UTF-8"))
        String signingInput = "${headerB64}.${claimsB64}"

        String pkcs8 = (sa.private_key as String)
                .replace("-----BEGIN PRIVATE KEY-----", "")
                .replace("-----END PRIVATE KEY-----", "")
                .replaceAll("\\s", "")
        def keySpec = new java.security.spec.PKCS8EncodedKeySpec(Base64.getDecoder().decode(pkcs8))
        def privateKey = java.security.KeyFactory.getInstance("RSA").generatePrivate(keySpec)

        def signer = java.security.Signature.getInstance("SHA256withRSA")
        signer.initSign(privateKey)
        signer.update(signingInput.getBytes("UTF-8"))
        String signatureB64 = Base64.getUrlEncoder().withoutPadding().encodeToString(signer.sign())
        String jwt = "${signingInput}.${signatureB64}"

        // --- Exchange the JWT for an OAuth2 access token ---
        HttpURLConnection tokenConn = (HttpURLConnection) new URL(sa.token_uri as String).openConnection()
        tokenConn.setRequestMethod("POST")
        tokenConn.setDoOutput(true)
        tokenConn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
        String formBody = "grant_type=" + URLEncoder.encode("urn:ietf:params:oauth:grant-type:jwt-bearer", "UTF-8") +
                "&assertion=" + URLEncoder.encode(jwt, "UTF-8")
        tokenConn.getOutputStream().write(formBody.getBytes("UTF-8"))

        int tokenCode = tokenConn.getResponseCode()
        String tokenResp = (tokenCode in 200..299 ? tokenConn.getInputStream() : tokenConn.getErrorStream()).getText("UTF-8")
        if (!(tokenCode in 200..299)) {
            logger.lifecycle("==> FCM token exchange failed (HTTP ${tokenCode}): ${tokenResp}")
            return
        }
        String accessToken = new groovy.json.JsonSlurper().parseText(tokenResp).access_token

        // --- Send the push to the "app_updates" topic (data-only, so AppFcmService always
        // handles it itself rather than the OS auto-displaying a bare system notification) ---
        String payload = groovy.json.JsonOutput.toJson([
                message: [
                        topic: "app_updates",
                        data : [title: title, body: body]
                ]
        ])
        HttpURLConnection sendConn = (HttpURLConnection) new URL("https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send").openConnection()
        sendConn.setRequestMethod("POST")
        sendConn.setDoOutput(true)
        sendConn.setRequestProperty("Content-Type", "application/json; charset=UTF-8")
        sendConn.setRequestProperty("Authorization", "Bearer ${accessToken}")
        sendConn.getOutputStream().write(payload.getBytes("UTF-8"))

        int sendCode = sendConn.getResponseCode()
        String sendResp = (sendCode in 200..299 ? sendConn.getInputStream() : sendConn.getErrorStream()).getText("UTF-8")
        if (sendCode in 200..299) {
            logger.lifecycle("==> Push notification sent to topic 'app_updates': ${sendResp}")
        } else {
            logger.lifecycle("==> Push notification send FAILED (HTTP ${sendCode}): ${sendResp}")
        }
    } catch (Exception e) {
        logger.lifecycle("==> Push notification send error: ${e}")
    }
}

// AGP registers its variant tasks (assembleRelease included) lazily during project evaluation,
// so wiring this from afterEvaluate ensures the task actually exists by the time we look it up.
afterEvaluate {
    tasks.named('assembleRelease') {
        finalizedBy 'publishReleaseToGit'
    }
}
